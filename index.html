<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg: #050505;
            --cell: #1a1a1a;
            --p1: #00d2ff;
            --pc: #ff00ff;
            --win: #39ff14;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }

        .game-header {
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-align: center;
            animation: neon-glow 4s infinite alternate;
        }

        @keyframes neon-glow {
            0% { color: var(--p1); text-shadow: 0 0 10px var(--p1), 0 0 20px var(--p1); }
            50% { color: var(--pc); text-shadow: 0 0 10px var(--pc), 0 0 20px var(--pc); }
            100% { color: var(--win); text-shadow: 0 0 10px var(--win), 0 0 20px var(--win); }
        }

        #status { font-size: 1.2rem; margin-bottom: 15px; text-shadow: 0 0 10px var(--p1); font-weight: bold; }
        
        .menu { margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .menu button {
            padding: 8px 12px;
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .menu button.active { border-color: var(--p1); color: var(--p1); box-shadow: 0 0 10px var(--p1); }

        #grid {
            display: grid;
            gap: 8px;
            background: #222;
            padding: 8px;
            border-radius: 10px;
        }

        .cell {
            background: var(--cell);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }

        .cell.x { color: var(--p1); text-shadow: 0 0 15px var(--p1); }
        .cell.o { color: var(--pc); text-shadow: 0 0 15px var(--pc); }
        .cell.winner { background: var(--win); color: #000; }

        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <h1 class="game-header">Tic Tac Toe</h1>

    <div id="overlay">
        <h1 id="res-msg" style="font-size: 3rem;">YOU WIN</h1>
        <button onclick="initGame()" style="padding: 15px 30px; background: var(--p1); border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">PLAY AGAIN</button>
    </div>

    <div id="status">YOUR TURN</div>

    <div class="menu">
        <button id="mode-pc" class="active" onclick="setMode('pc')">VS PC</button>
        <button id="mode-2p" onclick="setMode('2p')">2 PLAYERS</button>
    </div>

    <div class="menu">
        <button id="m3" class="active" onclick="setSize(3)">3x3</button>
        <button id="m4" onclick="setSize(4)">4x4</button>
        <button id="m5" onclick="setSize(5)">5x5</button>
    </div>

    <div id="grid"></div>

    <script>
        const gridEl = document.getElementById('grid');
        const statusEl = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const resMsg = document.getElementById('res-msg');

        let size = 3;
        let board = [];
        let isGameOver = false;
        let turn = 'X'; 
        let gameMode = 'pc'; // 'pc' or '2p'

        function setMode(m) {
            gameMode = m;
            document.getElementById('mode-pc').classList.toggle('active', m === 'pc');
            document.getElementById('mode-2p').classList.toggle('active', m === '2p');
            initGame();
        }

        function setSize(s) {
            size = s;
            document.querySelectorAll('.menu button[id^="m"]').forEach(b => b.classList.remove('active'));
            document.getElementById('m' + s).classList.add('active');
            initGame();
        }

        function initGame() {
            board = Array(size * size).fill('');
            isGameOver = false;
            turn = 'X';
            overlay.style.display = 'none';
            statusEl.innerText = gameMode === 'pc' ? "YOUR TURN (X)" : "PLAYER 1 TURN (X)";
            render();
        }

        function render() {
            gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            gridEl.innerHTML = '';
            const cellSize = size === 3 ? 100 : size === 4 ? 75 : 60;

            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = `cell ${val.toLowerCase()}`;
                cell.style.width = cell.style.height = cellSize + 'px';
                cell.innerText = val;
                cell.onclick = () => handleMove(i);
                gridEl.appendChild(cell);
            });
        }

        function handleMove(idx) {
            if (board[idx] !== '' || isGameOver) return;
            
            if (gameMode === 'pc' && turn !== 'X') return;

            board[idx] = turn;
            render();

            if (checkWin(turn)) return endGame(gameMode === 'pc' ? (turn === 'X' ? "YOU WIN" : "PC WINS") : `PLAYER ${turn === 'X' ? '1' : '2'} WINS`);
            if (board.every(b => b !== '')) return endGame("DRAW");

            turn = turn === 'X' ? 'O' : 'X';
            
            if (gameMode === 'pc') {
                statusEl.innerText = "PC THINKING...";
                setTimeout(pcMove, 500);
            } else {
                statusEl.innerText = `PLAYER ${turn === 'X' ? '1' : '2'} TURN (${turn})`;
            }
        }

        function pcMove() {
            if (isGameOver) return;

            // 1. Try to Win
            let move = findBestSpot('O');
            // 2. Block Player Win
            if (move === null) move = findBestSpot('X');
            // 3. Take Center if available
            if (move === null) {
                const center = Math.floor(board.length / 2);
                if (board[center] === '') move = center;
            }
            // 4. Strategic move (Corners or Random)
            if (move === null) move = getStrategicMove();

            board[move] = 'O';
            render();

            if (checkWin('O')) return endGame("PC WINS");
            if (board.every(b => b !== '')) return endGame("DRAW");

            turn = 'X';
            statusEl.innerText = "YOUR TURN (X)";
        }

        function getStrategicMove() {
            const corners = [0, size - 1, size * (size - 1), size * size - 1];
            const availableCorners = corners.filter(i => board[i] === '');
            if (availableCorners.length > 0) return availableCorners[Math.floor(Math.random() * availableCorners.length)];
            
            const available = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        function findBestSpot(player) {
            const lines = getLines();
            for (let line of lines) {
                const vals = line.map(idx => board[idx]);
                // Check if player is one move away from winning this line
                if (vals.filter(v => v === player).length === size - 1 && vals.filter(v => v === '').length === 1) {
                    return line[vals.indexOf('')];
                }
            }
            return null;
        }

        function getLines() {
            let lines = [];
            for (let r = 0; r < size; r++) {
                let row = [];
                for (let c = 0; c < size; c++) row.push(r * size + c);
                lines.push(row);
            }
            for (let c = 0; c < size; c++) {
                let col = [];
                for (let r = 0; r < size; r++) col.push(r * size + c);
                lines.push(col);
            }
            let d1 = [], d2 = [];
            for (let i = 0; i < size; i++) {
                d1.push(i * size + i);
                d2.push(i * size + (size - 1 - i));
            }
            lines.push(d1, d2);
            return lines;
        }

        function checkWin(player) {
            const lines = getLines();
            return lines.some(line => {
                if (line.every(idx => board[idx] === player)) {
                    line.forEach(idx => gridEl.children[idx].classList.add('winner'));
                    return true;
                }
                return false;
            });
        }

        function endGame(msg) {
            isGameOver = true;
            resMsg.innerText = msg;
            if (msg.includes("PLAYER 1") || msg === "YOU WIN") resMsg.style.color = "var(--p1)";
            else if (msg.includes("PLAYER 2") || msg === "PC WINS") resMsg.style.color = "var(--pc)";
            else resMsg.style.color = "#fff";
            
            setTimeout(() => { overlay.style.display = 'flex'; }, 800);
        }

        initGame();
    </script>
</body>
</html>
